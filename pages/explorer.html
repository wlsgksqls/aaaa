<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>탐색 | Study Vault</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
</head>
<body>
  <div class="noise"></div>
  <header class="site-header">
    <a class="brand" href="../index.html">
      <span class="brand-mark">SV</span>
      <span><strong>Study Vault</strong><small>탐색</small></span>
    </a>
    <nav class="top-nav">
      <a class="active" href="./explorer.html">탐색</a>
      <a href="./library.html">자료실</a>
      <a href="./about.html">소개</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button">◐</button>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <div class="search-box">
        <label for="searchInput">검색</label>
        <input id="searchInput" type="search" placeholder="예: 함수, 문학, 광합성" />
      </div>

      <div class="filter-block">
        <h2>과목</h2>
        <div id="subjectFilters" class="pill-list"></div>
      </div>

      <div class="filter-block">
        <h2>수준</h2>
        <div id="levelFilters" class="pill-list"></div>
      </div>

      <div class="tip-card">
        <strong>관리 팁</strong>
        <p>새 과목은 `data/subjects`에 JSON을 추가하고 `data/site.json`에 등록하면 됩니다.</p>
      </div>
    </aside>

    <section class="content-area">
      <div class="content-toolbar">
        <div>
          <p class="eyebrow">Knowledge Explorer</p>
          <h1>단원 탐색</h1>
        </div>
        <select id="sortSelect" aria-label="정렬">
          <option value="default">기본 정렬</option>
          <option value="title">제목순</option>
          <option value="subject">과목순</option>
        </select>
      </div>

      <div id="resultCount" class="result-count"></div>
      <div id="unitList" class="unit-list"></div>
    </section>
  </main>

  <dialog id="unitDialog" class="unit-dialog">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="닫기">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <footer class="site-footer">
    <p>© 2026 Study Vault. All rights reserved.</p>
    <div class="footer-links">
      <a href="../docs/DEPLOY.md">배포 가이드</a>
      <a class="github-link" href="https://github.com/wlsgksqls/aaaa" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.42-4.04-1.42-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.4 11.4 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </footer>

  <script type="module" src="../assets/js/explorer.js"></script>
</body>
</html>
